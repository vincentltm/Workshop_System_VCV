<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="100%" height="100%" viewBox="0 0 300 380" version="1.1"
     xmlns="http://www.w3.org/2000/svg"
     style="fill-rule:evenodd;clip-rule:evenodd;stroke-linecap:round;stroke-linejoin:round;stroke-miterlimit:10;">
  
  <!-- Main panel background -->
  <rect x="0" y="0" width="300" height="380" fill="#141414"/>
  
  <!-- Outer border stroke -->
  <rect x="1.5" y="1.5" width="297" height="377" rx="3" fill="none" stroke="#2b2b2b" stroke-width="1.5"/>

  <!-- Corner screw holes -->
  <g transform="translate(7.5, 7.5)">
    <circle cx="0" cy="0" r="4.5" fill="#222" stroke="#444" stroke-width="0.8"/>
    <line x1="-2.5" y1="-2.5" x2="2.5" y2="2.5" stroke="#111" stroke-width="1"/>
    <line x1="-2.5" y1="2.5" x2="2.5" y2="-2.5" stroke="#111" stroke-width="1"/>
  </g>
  <g transform="translate(7.5, 372.5)">
    <circle cx="0" cy="0" r="4.5" fill="#222" stroke="#444" stroke-width="0.8"/>
    <line x1="-2.5" y1="-2.5" x2="2.5" y2="2.5" stroke="#111" stroke-width="1"/>
    <line x1="-2.5" y1="2.5" x2="2.5" y2="-2.5" stroke="#111" stroke-width="1"/>
  </g>
  <g transform="translate(292.5, 7.5)">
    <circle cx="0" cy="0" r="4.5" fill="#222" stroke="#444" stroke-width="0.8"/>
    <line x1="-2.5" y1="-2.5" x2="2.5" y2="2.5" stroke="#111" stroke-width="1"/>
    <line x1="-2.5" y1="2.5" x2="2.5" y2="-2.5" stroke="#111" stroke-width="1"/>
  </g>
  <g transform="translate(292.5, 372.5)">
    <circle cx="0" cy="0" r="4.5" fill="#222" stroke="#444" stroke-width="0.8"/>
    <line x1="-2.5" y1="-2.5" x2="2.5" y2="2.5" stroke="#111" stroke-width="1"/>
    <line x1="-2.5" y1="2.5" x2="2.5" y2="-2.5" stroke="#111" stroke-width="1"/>
  </g>

  <!-- Horizontal divider lines representing pedalboard rails -->
  <rect x="25" y="38" width="250" height="28" fill="#09090b" rx="2"/>
  <rect x="25" y="145" width="250" height="28" fill="#09090b" rx="2"/>
  <rect x="25" y="272" width="250" height="28" fill="#09090b" rx="2"/>

  <!-- Left Jack Plate (Output) -->
  <rect x="5" y="70" width="20" height="240" rx="3" fill="#1b1b1b" stroke="#2a2a2a" stroke-width="1"/>
  <circle cx="15" cy="175" r="10" fill="none" stroke="#333" stroke-width="1"/>

  <!-- Right Jack Plate (Input) -->
  <rect x="275" y="70" width="20" height="240" rx="3" fill="#1b1b1b" stroke="#2a2a2a" stroke-width="1"/>
  <circle cx="285" cy="175" r="10" fill="none" stroke="#333" stroke-width="1"/>

  <!-- ==========================================
       PEDAL 1: REVERB (Dark Grey, col_x = 50)
       ========================================== -->
  <rect x="27" y="30" width="46" height="320" rx="6" fill="#333333" stroke="#222222" stroke-width="1.5"/>
  <circle cx="50" cy="270" r="5" fill="none" stroke="#222" stroke-width="1"/>
  <circle cx="50" cy="115" r="14" fill="none" stroke="#222" stroke-width="1.2"/>
  <circle cx="50" cy="195" r="14" fill="none" stroke="#222" stroke-width="1.2"/>
  <!-- Foot Switch Plate -->
  <rect x="33" y="300" width="34" height="42" rx="3" fill="#222" stroke="#555" stroke-width="1"/>
  <circle cx="50" cy="321" r="10" fill="none" stroke="#444" stroke-width="1"/>

