       ========================================== -->
  <rect x="77" y="30" width="46" height="320" rx="6" fill="#bbbbbb" stroke="#888888" stroke-width="1.5"/>
  <circle cx="100" cy="270" r="5" fill="none" stroke="#222" stroke-width="1"/>
  <circle cx="100" cy="100" r="14" fill="none" stroke="#222" stroke-width="1.2"/>
  <circle cx="100" cy="160" r="10" fill="none" stroke="#222" stroke-width="1.2"/>
  <circle cx="100" cy="220" r="10" fill="none" stroke="#222" stroke-width="1.2"/>
  <!-- Foot Switch Plate -->
  <rect x="83" y="300" width="34" height="42" rx="3" fill="#222" stroke="#555" stroke-width="1"/>
  <circle cx="100" cy="321" r="10" fill="none" stroke="#444" stroke-width="1"/>

  <!-- ==========================================
       PEDAL 3: CHORUS (Blue, col_x = 150)
       ========================================== -->
  <rect x="127" y="30" width="46" height="320" rx="6" fill="#1e40af" stroke="#112466" stroke-width="1.5"/>
  <circle cx="150" cy="270" r="5" fill="none" stroke="#222" stroke-width="1"/>
  <circle cx="150" cy="100" r="14" fill="none" stroke="#222" stroke-width="1.2"/>
  <circle cx="150" cy="160" r="10" fill="none" stroke="#222" stroke-width="1.2"/>
  <circle cx="150" cy="220" r="10" fill="none" stroke="#222" stroke-width="1.2"/>
  <!-- Foot Switch Plate -->
  <rect x="133" y="300" width="34" height="42" rx="3" fill="#222" stroke="#555" stroke-width="1"/>
  <circle cx="150" cy="321" r="10" fill="none" stroke="#444" stroke-width="1"/>

  <!-- ==========================================
       PEDAL 4: PHASER (Orange, col_x = 200)
       ========================================== -->
  <rect x="177" y="30" width="46" height="320" rx="6" fill="#d97706" stroke="#8a4b00" stroke-width="1.5"/>
  <circle cx="200" cy="270" r="5" fill="none" stroke="#222" stroke-width="1"/>
  <circle cx="200" cy="100" r="14" fill="none" stroke="#222" stroke-width="1.2"/>
  <circle cx="200" cy="160" r="10" fill="none" stroke="#222" stroke-width="1.2"/>
  <circle cx="200" cy="220" r="10" fill="none" stroke="#222" stroke-width="1.2"/>
  <!-- Foot Switch Plate -->
  <rect x="183" y="300" width="34" height="42" rx="3" fill="#222" stroke="#555" stroke-width="1"/>
  <circle cx="200" cy="321" r="10" fill="none" stroke="#444" stroke-width="1"/>

  <!-- ==========================================
       PEDAL 5: DISTORTION (Red, col_x = 250)
       ========================================== -->
  <rect x="227" y="30" width="46" height="320" rx="6" fill="#9f1239" stroke="#5c0a21" stroke-width="1.5"/>
  <circle cx="250" cy="270" r="5" fill="none" stroke="#222" stroke-width="1"/>
  <circle cx="250" cy="100" r="14" fill="none" stroke="#222" stroke-width="1.2"/>
  <circle cx="250" cy="160" r="10" fill="none" stroke="#222" stroke-width="1.2"/>
  <circle cx="250" cy="220" r="10" fill="none" stroke="#222" stroke-width="1.2"/>
  <!-- Foot Switch Plate -->
  <rect x="233" y="300" width="34" height="42" rx="3" fill="#222" stroke="#555" stroke-width="1"/>
  <circle cx="250" cy="321" r="10" fill="none" stroke="#444" stroke-width="1"/>

</svg>
